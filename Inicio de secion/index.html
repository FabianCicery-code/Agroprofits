<div class="login-container">
    <a href="../index.html" class="flecha-regreso">← Volver</a>
    <img src="./img/logoAgro.svg" class="logo" alt="AgroProfits">

    <h2>AgroProfits</h2>
    <p class="subtitulo">Sistema contable de compra y venta de café</p>
    <link rel="stylesheet"  href="css/style.css">


    <form class="login-form">
        <label>Usuario</label>
        <input type="text" placeholder="Ingrese su usuario" required>
        <label>Contraseña</label>
        <input type="password" placeholder="Ingrese su contraseña" required>
        <button type="submit">Iniciar sesión</button>
        <p><a href="#">¿Olvidaste tu contraseña?</a></p>
        <div class="crear-cuenta">
            <p>¿No tienes una cuenta? <a
            href="../Registro Usuario/index.html">Crear cuenta </a></p>
        </div>
    </form>
</div>
